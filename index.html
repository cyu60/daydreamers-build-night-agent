<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Night Agent — DayDreamers × MentorMates</title>
<meta name="theme-color" content="#10111a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Build Night Agent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<link rel="apple-touch-icon" href="/public/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8;
    --fg: #10111a;
    --fg-soft: #23263a;
    --muted: #70675f;
    --accent: #2652e6;
    --accent-light: #dfe7ff;
    --gold: #d3a14a;
    --border: rgba(16,17,26,0.10);
    --card: #fbf7f1;
    --section-alt: #ece5da;
    --radius: 14px;
    --hero-bg: #10111a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(38,82,230,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(211,161,74,0.08) 0%, transparent 55%),
      linear-gradient(180deg, #0f1019 0%, #141525 100%);
    color: var(--fg);
    line-height: 1.7;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    padding: 1.5rem;
  }

  @media (max-width: 640px) {
    body { padding: 0; }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 3rem);
    max-width: 820px;
    margin: 0 auto;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.35),
      0 2px 6px rgba(0,0,0,0.15);
  }

  @media (max-width: 640px) {
    .shell {
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  .topbar {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .brand-logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  .brand h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    font-weight: 400;
    color: var(--fg);
    white-space: nowrap;
  }

  .brand h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .powered {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .powered a {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--fg);
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .powered a:hover { opacity: 0.7; }

  .powered img {
    height: 14px;
    width: auto;
    object-fit: contain;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    color: #c83232;
    border-color: rgba(200,50,50,0.3);
    background: rgba(200,50,50,0.05);
  }

  .progress {
    padding: 0.65rem 1.5rem;
    background: var(--section-alt);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
  }

  .step {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border-radius: 100px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: all 0.2s;
  }

  .step.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .step.done {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent-light);
  }

  .suggestions {
    padding: 0.75rem 1.5rem 0.5rem;
    background: var(--bg);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .suggestion {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.45rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--fg-soft);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .suggestion:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .suggestions.hidden { display: none; }

  @media (max-width: 600px) {
    .suggestions { overflow-x: auto; flex-wrap: nowrap; padding: 0.6rem 1rem 0.4rem; }
    .suggestion { font-size: 0.72rem; padding: 0.4rem 0.75rem; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 560px;
    display: flex;
    flex-direction: column;
    animation: fade-up 0.3s ease-out;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .msg-bubble {
    padding: 0.85rem 1.15rem;
    border-radius: var(--radius);
    font-size: 0.9rem;
    line-height: 1.65;
    max-width: 100%;
    width: fit-content;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg.assistant .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg-soft);
  }

  .msg.user .msg-bubble {
    background: var(--hero-bg);
    color: rgba(255,255,255,0.92);
  }

  .msg-bubble a { color: var(--accent); }
  .msg-bubble strong { color: var(--accent); font-weight: 600; }
  .msg-bubble code {
    background: var(--section-alt);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.82em;
  }

  .msg-video {
    display: block;
    width: 100%;
    max-width: 440px;
    margin: 0.65rem 0 0.25rem;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .typing {
    display: none;
    align-self: flex-start;
    padding: 0.85rem 1.15rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    gap: 5px;
    align-items: center;
    margin-top: 0.25rem;
  }

  .typing.visible { display: flex; }

  .typing-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  .input-area {
    padding: 1rem 1.5rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--card);
  }

  .input-row {
    display: flex;
    gap: 0.65rem;
    align-items: flex-end;
  }

  .input-wrap { flex: 1; position: relative; }

  .input-wrap textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.8rem 1rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 44px;
    max-height: 140px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(38,82,230,0.08);
  }

  .input-wrap textarea::placeholder { color: rgba(112,103,95,0.5); }

  .send-btn {
    background: var(--hero-bg);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.8rem 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.98); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .footer-hint {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    margin-top: 0.55rem;
    letter-spacing: 0.02em;
    opacity: 0.6;
    text-align: center;
  }

  .footer-hint kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0 4px;
    border-radius: 3px;
    font-size: 0.55rem;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(16,17,26,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.visible { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem 1.75rem 1.5rem;
    width: min(400px, calc(100% - 2rem));
    box-shadow: 0 10px 40px rgba(16,17,26,0.2);
  }

  .modal h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    font-weight: 400;
    margin-bottom: 0.4rem;
    color: var(--fg);
  }

  .modal p {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1rem;
    line-height: 1.6;
  }

  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem;
    outline: none;
    margin-bottom: 0.75rem;
    transition: border-color 0.2s;
  }

  .modal input:focus {
    border-color: var(--accent);
  }

  .modal button {
    background: var(--hero-bg);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 0.7rem 1.5rem;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }

  .modal button:hover { background: var(--accent); }

  .modal-error {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: #c83232;
    margin-top: 0.5rem;
    min-height: 1rem;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff0f0;
    border: 1px solid rgba(200,50,50,0.2);
    color: #c83232;
    padding: 0.65rem 1.25rem;
    border-radius: var(--radius);
    font-size: 0.78rem;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
    pointer-events: none;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    .powered span.label { display: none; }
    .progress { padding: 0.5rem 1rem; }
    .step { font-size: 0.55rem; padding: 0.25rem 0.55rem; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/public/daydreamers-logo.png" alt="DayDreamers">
      <h1>Build Night <em>Agent</em></h1>
    </div>
    <div class="powered">
      <button class="clear-btn" id="clearBtn" title="Clear chat history">Clear</button>
      <span class="label">Powered by</span>
      <a href="https://www.mentormates.ai" target="_blank" rel="noopener">
        <img src="/public/mentormates-logo.png" alt="MentorMates">
      </a>
    </div>
  </div>

  <div class="progress" id="progress">
    <span class="step active" data-step="intent">Intent</span>
    <span class="step" data-step="learn">Learn Tinyfish</span>
    <span class="step" data-step="tf-key">Tinyfish key</span>
    <span class="step" data-step="recording">Recording</span>
    <span class="step" data-step="run">Run</span>
    <span class="step" data-step="mm-key">MM key</span>
    <span class="step" data-step="submit">Submit</span>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" data-prompt="What should I start building today?">What should I build today?</button>
    <button class="suggestion" data-prompt="How do I find my Tinyfish API key?">Find my Tinyfish API key</button>
    <button class="suggestion" data-prompt="How do I submit to MentorMates?">How do I submit to MentorMates?</button>
    <button class="suggestion" data-prompt="Can you show me a Tinyfish demo?">Show me a Tinyfish demo</button>
  </div>

  <div class="messages" id="messages">
    <div class="typing" id="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="input" placeholder="Tell the agent what you're trying to build..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
    <div class="footer-hint">
      <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> new line
    </div>
  </div>
</div>

<div class="modal-overlay" id="emailModal">
  <div class="modal">
    <h3>Welcome to build night 👋</h3>
    <p>Enter your email so we can save your chat and sync your submission.</p>
    <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
    <button id="emailSubmit">Continue</button>
    <div class="modal-error" id="emailError"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG = { runEndpoint: '/api/run', workflow: 'build-night-guide' };
const SESSION_KEY = 'daydreamers-build-night-session';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
function typing(visible) {
  const el = document.getElementById('typing');
  if (!el) return;
  if (visible) el.classList.add('visible'); else el.classList.remove('visible');
  if (visible) messagesEl.scrollTop = messagesEl.scrollHeight;
}
const toastEl = document.getElementById('toast');
const progressEl = document.getElementById('progress');

const EMAIL_KEY = SESSION_KEY + ':email';
const TF_KEY = SESSION_KEY + ':tfkey';
const MM_KEY = SESSION_KEY + ':mmkey';
const TF_URL = SESSION_KEY + ':tfurl';
const TF_GOAL = SESSION_KEY + ':tfgoal';
const TF_RAN = SESSION_KEY + ':tfran';

let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem(SESSION_KEY, sessionId);
}

let userEmail = localStorage.getItem(EMAIL_KEY);
let tinyfishKey = sessionStorage.getItem(TF_KEY) || null;

let mmKey = sessionStorage.getItem(MM_KEY) || null;

// Lightweight capture of a Tinyfish or MentorMates key the moment the
// participant pastes one (so it's available for any <<TINYFISH_RUN>> or
// <<MM_SUBMIT>> marker the agent emits later). Stored in sessionStorage only —
// cleared when the tab closes. Never persisted to our server in plaintext.
function captureTinyfishKeyFrom(text) {
  // Tinyfish keys in the wild: `sk-tinyfish-<20+ chars>`, `tk_<20+ chars>`,
  // or `tinyfish_<20+ chars>`. Scan the whole blob — users paste shell exports,
  // docs, .env lines.
  const tf = text.match(/\bsk-tinyfish-[A-Za-z0-9_-]{8,}|\btk_[A-Za-z0-9_-]{10,}|\btinyfish_[A-Za-z0-9_-]{10,}/i);
  if (tf && !tinyfishKey) {
    tinyfishKey = tf[0];
    sessionStorage.setItem(TF_KEY, tinyfishKey);
  }
  // MentorMates participant keys: mm_sk_<hex>. Same blob-scan policy.
  const mm = text.match(/\bmm_sk_[A-Za-z0-9_-]{10,}/);
  if (mm && !mmKey) {
    mmKey = mm[0];
    sessionStorage.setItem(MM_KEY, mmKey);
  }
}

let conversation = JSON.parse(localStorage.getItem(SESSION_KEY + ':msgs') || '[]');
let sending = false;

function persist() {
  localStorage.setItem(SESSION_KEY + ':msgs', JSON.stringify(conversation));
}

function render() {
  if (conversation.length === 0) {
    conversation.push({
      role: 'assistant',
      text: "Hey! I'll help you ship a Tinyfish project to MentorMates tonight.\n\nWhat are you trying to build?",
      ts: Date.now(),
    });
    persist();
  }
  const msgsHtml = conversation.map(m => {
    const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const label = m.role === 'user' ? 'you' : 'agent';
    return `
      <div class="msg ${m.role}">
        <div class="msg-meta">${label} · ${time}</div>
        <div class="msg-bubble">${formatText(m.text)}</div>
      </div>
    `;
  }).join('');
  messagesEl.innerHTML = msgsHtml + `
    <div class="typing" id="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function updateProgress(stepId) {
  if (!stepId) return;
  const steps = Array.from(progressEl.querySelectorAll('.step'));
  const activeIdx = steps.findIndex(s => s.dataset.step === stepId);
  if (activeIdx < 0) return;
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i < activeIdx) s.classList.add('done');
    else if (i === activeIdx) s.classList.add('active');
  });
}

function isPlayableVideoUrl(url) {
  return /\.(mp4|webm|mov)(\?|$)/i.test(url);
}

function videoEmbed(url) {
  return `<video controls playsinline preload="metadata" class="msg-video">`
    + `<source src="${url}">`
    + `Your browser can't play this video. <a href="${url}" target="_blank" rel="noopener">Open it here</a>.`
    + `</video>`;
}

function formatText(text) {
  // 0. Strip internal tool-call markers so they never render to the participant.
  text = text
    .replace(/<<TINYFISH_RUN\s+[^>]*>>/g, '')
    .replace(/<<MM_SUBMIT\s+[^>]*>>/g, '')
    .trim();

  // 1. HTML-escape everything so agent-emitted content can't inject markup.
  let s = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // 2. Markdown links [label](url) → <a> OR <video> when the URL is a
  //    playable video file. Record placeholders so the bare-URL pass below
  //    doesn't re-match the URL inside the href we just wrote.
  const slots = [];
  s = s.replace(/\[([^\]]+?)\]\((https?:[^)\s]+)\)/g, (_, label, url) => {
    const html = isPlayableVideoUrl(url) ? videoEmbed(url)
      : `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    const i = slots.push(html) - 1;
    return `\u0000SLOT${i}\u0000`;
  });

  // 3. Bare URLs only when preceded by whitespace or start-of-string (so they
  //    can never appear inside an attribute).
  s = s.replace(
    /(^|[\s(])(https?:\/\/[^\s<)"']+)/g,
    (_, lead, url) => {
      const html = isPlayableVideoUrl(url) ? videoEmbed(url)
        : `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
      return `${lead}${html}`;
    },
  );

  // 4. Inline formatting + restore link/video slots.
  s = s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>')
    .replace(/\u0000SLOT(\d+)\u0000/g, (_, i) => slots[Number(i)]);

  return s;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  autoResize();
  captureTinyfishKeyFrom(text);
  conversation.push({ role: 'user', text, ts: Date.now() });
  persist();
  render();
  maybeHideSuggestions();
  typing(true);
  try {
    const transcript = conversation
      .map(m => `${m.role === 'user' ? 'PARTICIPANT' : 'AGENT'}: ${m.text}`)
      .join('\n\n');
    const turnId = 'turn_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const res = await fetch(CONFIG.runEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workflow_id: CONFIG.workflow,
        input: {
          session_id: sessionId,
          run_id: turnId,
          idempotency_key: turnId,
          message: text,
          transcript: transcript,
        },
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data?.result?.output_text || data?.output_text || 'No response received.';
    const step = data?.result?.step || data?.step;
    conversation.push({ role: 'assistant', text: reply, ts: Date.now() });
    persist();
    if (step) updateProgress(step);

    // Path A: Intercept <<TINYFISH_RUN url="..." goal="...">> marker.
    const tfMarker = reply.match(/<<TINYFISH_RUN\s+url="([^"]+)"\s+goal="([^"]+)"\s*>>/);
    const alreadyRan = sessionStorage.getItem(TF_RAN) === '1';
    if (tfMarker && tinyfishKey && !alreadyRan) {
      const [, tfUrl, tfGoal] = tfMarker;
      sessionStorage.setItem(TF_RAN, '1');
      await runTinyfishAndContinue(tfUrl, tfGoal);
    } else if (
      !alreadyRan && tinyfishKey && tinyfishUrl && tinyfishGoal && agentPromisedRun(reply)
    ) {
      // Path B (fallback): agent said it would run but didn't emit a marker.
      // Trigger based on captured state.
      sessionStorage.setItem(TF_RAN, '1');
      await runTinyfishAndContinue(tinyfishUrl, tinyfishGoal);
    }

    // Intercept <<MM_SUBMIT event_ref="..." name="..." description="..." ...>> marker.
    const mmMarker = reply.match(/<<MM_SUBMIT\s+([^>]+)>>/);
    if (mmMarker && mmKey) {
      const attrs = {};
      for (const m of mmMarker[1].matchAll(/(\w+)="([^"]*)"/g)) attrs[m[1]] = m[2];
      await submitToMentorMatesAndContinue(attrs);
    }
  } catch (err) {
    conversation.push({
      role: 'assistant',
      text: `Sorry — request failed: ${err.message}. Try again in a second.`,
      ts: Date.now(),
    });
    persist();
    showToast(`Request failed: ${err.message}`);
  } finally {
    typing(false);
    sending = false;
    sendBtn.disabled = false;
    render();
    inputEl.focus();
  }
}

async function submitToMentorMatesAndContinue(attrs) {
  const payload = {
    api_key: mmKey,
    event_ref: attrs.event_ref,
    project_name: attrs.name,
    project_description: attrs.description,
    project_url: attrs.project_url || undefined,
    video_url: attrs.video_url || undefined,
    lead_email: userEmail || undefined,
  };
  conversation.push({
    role: 'assistant',
    text: `_submitting to MentorMates (${attrs.event_ref})..._`,
    ts: Date.now(),
  });
  persist();
  render();
  typing(true);
  let outcome;
  try {
    const r = await fetch('/api/mm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      outcome = `MM_ERROR: ${data.error || r.status}${data.detail ? ' — ' + JSON.stringify(data.detail).slice(0, 300) : ''}`;
    } else {
      outcome = `MM_RESULT: ${JSON.stringify({ project_id: data.project_id, mm_project_url: data.mm_project_url, joined: data.joined })}`;
    }
  } catch (err) {
    outcome = `MM_ERROR: ${err.message}`;
  } finally {
    typing(false);
  }
  conversation.push({ role: 'user', text: outcome, ts: Date.now() });
  persist();
  render();
  try {
    const transcript = conversation
      .map(m => `${m.role === 'user' ? 'PARTICIPANT' : 'AGENT'}: ${m.text}`)
      .join('\n\n');
    const turnId = 'turn_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    typing(true);
    const res = await fetch(CONFIG.runEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workflow_id: CONFIG.workflow,
        input: {
          session_id: sessionId,
          run_id: turnId,
          idempotency_key: turnId,
          message: outcome,
          transcript,
        },
      }),
    });
    const data = await res.json();
    const reply = data?.result?.output_text || data?.output_text || '';
    if (reply) {
      conversation.push({ role: 'assistant', text: reply, ts: Date.now() });
      persist();
    }
  } catch (err) {
    showToast(`Follow-up failed: ${err.message}`);
  } finally {
    typing(false);
    render();
  }
}

async function runTinyfishAndContinue(url, goal) {
  // Show a status bubble while the browser agent works
  conversation.push({
    role: 'assistant',
    text: `_running Tinyfish on ${url} — this usually takes 30-90 seconds..._`,
    ts: Date.now(),
  });
  persist();
  render();
  typing(true);

  let outcome;
  try {
    const r = await fetch('/api/tinyfish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: tinyfishKey, url, goal }),
    });
    const data = await r.json();
    if (!r.ok) {
      outcome = `TINYFISH_ERROR: ${data.error || r.status}${data.detail ? ' — ' + data.detail : ''}`;
    } else {
      outcome = `TINYFISH_RESULT: ${JSON.stringify(data.result).slice(0, 3000)}`;
      if (data.streaming_url) outcome += `\n(streaming URL: ${data.streaming_url})`;
    }
  } catch (err) {
    outcome = `TINYFISH_ERROR: ${err.message}`;
  } finally {
    typing(false);
  }

  // Feed result back to the agent as a participant-side message so it can summarize
  conversation.push({ role: 'user', text: outcome, ts: Date.now() });
  persist();
  render();

  // Re-send to get the agent's follow-up summary
  try {
    const transcript = conversation
      .map(m => `${m.role === 'user' ? 'PARTICIPANT' : 'AGENT'}: ${m.text}`)
      .join('\n\n');
    const turnId = 'turn_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    typing(true);
    const res = await fetch(CONFIG.runEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workflow_id: CONFIG.workflow,
        input: {
          session_id: sessionId,
          run_id: turnId,
          idempotency_key: turnId,
          message: outcome,
          transcript,
        },
      }),
    });
    const data = await res.json();
    const reply = data?.result?.output_text || data?.output_text || '';
    if (reply) {
      conversation.push({ role: 'assistant', text: reply, ts: Date.now() });
      persist();
    }
  } catch (err) {
    showToast(`Follow-up failed: ${err.message}`);
  } finally {
    typing(false);
    render();
  }
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  setTimeout(() => toastEl.classList.remove('visible'), 4000);
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

// Suggestion chips — one-click prompts
document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = btn.dataset.prompt || btn.textContent;
    autoResize();
    send();
    document.getElementById('suggestions').classList.add('hidden');
  });
});

// Hide suggestions once the conversation has more than the seed greeting
function maybeHideSuggestions() {
  const el = document.getElementById('suggestions');
  if (!el) return;
  if (conversation.filter(m => m.role === 'user').length > 0) el.classList.add('hidden');
  else el.classList.remove('hidden');
}

document.getElementById('clearBtn').addEventListener('click', async () => {
  if (!confirm('Clear chat history (local + server) and start a new session?')) return;
  try {
    await fetch(`/api/history?session_id=${encodeURIComponent(sessionId)}`, { method: 'DELETE' });
  } catch (e) { /* non-fatal */ }
  const oldSid = sessionId;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY + ':msgs');
  sessionStorage.removeItem(TF_KEY);
  sessionStorage.removeItem(TF_URL);
  sessionStorage.removeItem(TF_GOAL);
  sessionStorage.removeItem(TF_RAN);
  sessionStorage.removeItem(MM_KEY);
  tinyfishKey = null;
  tinyfishUrl = null;
  tinyfishGoal = null;
  mmKey = null;
  conversation = [];
  sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem(SESSION_KEY, sessionId);
  // re-link email to new session_id on server
  if (userEmail) {
    fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, email: userEmail }),
    }).catch(() => {});
  }
  const steps = Array.from(progressEl.querySelectorAll('.step'));
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i === 0) s.classList.add('active');
  });
  render();
  maybeHideSuggestions();
  showToast(`Chat cleared (session ${oldSid.slice(0, 12)}...)`);
});

// --- Email modal ---
const emailModal = document.getElementById('emailModal');
const emailInput = document.getElementById('emailInput');
const emailSubmit = document.getElementById('emailSubmit');
const emailError = document.getElementById('emailError');

function openEmailModal() {
  emailModal.classList.add('visible');
  emailError.textContent = '';
  setTimeout(() => emailInput.focus(), 50);
}

async function saveEmail(email) {
  try {
    const r = await fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, email }),
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${r.status}`);
    }
    userEmail = email;
    localStorage.setItem(EMAIL_KEY, email);
    emailModal.classList.remove('visible');
    inputEl.focus();
  } catch (err) {
    emailError.textContent = `Could not save: ${err.message}`;
  }
}

emailSubmit.addEventListener('click', () => {
  const v = (emailInput.value || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
    emailError.textContent = 'Please enter a valid email.';
    return;
  }
  saveEmail(v);
});

emailInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); emailSubmit.click(); }
});

if (!userEmail) openEmailModal();

render();
maybeHideSuggestions();
inputEl.focus();
</script>
