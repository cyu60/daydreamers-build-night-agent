<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Night Agent — DayDreamers × MentorMates</title>
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8;
    --fg: #10111a;
    --fg-soft: #23263a;
    --muted: #70675f;
    --accent: #2652e6;
    --accent-light: #dfe7ff;
    --gold: #d3a14a;
    --border: rgba(16,17,26,0.10);
    --card: #fbf7f1;
    --section-alt: #ece5da;
    --radius: 14px;
    --hero-bg: #10111a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
  }

  .topbar {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .brand-logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  .brand h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    font-weight: 400;
    color: var(--fg);
    white-space: nowrap;
  }

  .brand h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .powered {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .powered a {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--fg);
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .powered a:hover { opacity: 0.7; }

  .powered img {
    height: 14px;
    width: auto;
    object-fit: contain;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    color: #c83232;
    border-color: rgba(200,50,50,0.3);
    background: rgba(200,50,50,0.05);
  }

  .progress {
    padding: 0.65rem 1.5rem;
    background: var(--section-alt);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
  }

  .step {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border-radius: 100px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: all 0.2s;
  }

  .step.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .step.done {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent-light);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 560px;
    display: flex;
    flex-direction: column;
    animation: fade-up 0.3s ease-out;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .msg-bubble {
    padding: 0.85rem 1.15rem;
    border-radius: var(--radius);
    font-size: 0.9rem;
    line-height: 1.65;
    max-width: 100%;
    width: fit-content;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg.assistant .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg-soft);
  }

  .msg.user .msg-bubble {
    background: var(--hero-bg);
    color: rgba(255,255,255,0.92);
  }

  .msg-bubble a { color: var(--accent); }
  .msg-bubble strong { color: var(--accent); font-weight: 600; }
  .msg-bubble code {
    background: var(--section-alt);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.82em;
  }

  .typing {
    display: none;
    align-self: flex-start;
    padding: 0.85rem 1.15rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    gap: 5px;
    align-items: center;
  }

  .typing.visible { display: flex; }

  .typing-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  .input-area {
    padding: 1rem 1.5rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--card);
  }

  .input-row {
    display: flex;
    gap: 0.65rem;
    align-items: flex-end;
  }

  .input-wrap { flex: 1; position: relative; }

  .input-wrap textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.8rem 1rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 44px;
    max-height: 140px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(38,82,230,0.08);
  }

  .input-wrap textarea::placeholder { color: rgba(112,103,95,0.5); }

  .send-btn {
    background: var(--hero-bg);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.8rem 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.98); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .footer-hint {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    margin-top: 0.55rem;
    letter-spacing: 0.02em;
    opacity: 0.6;
    text-align: center;
  }

  .footer-hint kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0 4px;
    border-radius: 3px;
    font-size: 0.55rem;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff0f0;
    border: 1px solid rgba(200,50,50,0.2);
    color: #c83232;
    padding: 0.65rem 1.25rem;
    border-radius: var(--radius);
    font-size: 0.78rem;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
    pointer-events: none;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    .powered span.label { display: none; }
    .progress { padding: 0.5rem 1rem; }
    .step { font-size: 0.55rem; padding: 0.25rem 0.55rem; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/public/daydreamers-logo.png" alt="DayDreamers">
      <h1>Build Night <em>Agent</em></h1>
    </div>
    <div class="powered">
      <button class="clear-btn" id="clearBtn" title="Clear chat history">Clear</button>
      <span class="label">Powered by</span>
      <a href="https://www.mentormates.ai" target="_blank" rel="noopener">
        <img src="/public/mentormates-logo.png" alt="MentorMates">
      </a>
    </div>
  </div>

  <div class="progress" id="progress">
    <span class="step active" data-step="intent">Intent</span>
    <span class="step" data-step="learn">Learn Tinyfish</span>
    <span class="step" data-step="tf-key">Tinyfish key</span>
    <span class="step" data-step="recording">Recording</span>
    <span class="step" data-step="run">Run</span>
    <span class="step" data-step="mm-key">MM key</span>
    <span class="step" data-step="submit">Submit</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="typing" id="typing">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="input" placeholder="Tell the agent what you're trying to build..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
    <div class="footer-hint">
      <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> new line
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG = { runEndpoint: '/api/run', workflow: 'build-night-guide' };
const SESSION_KEY = 'daydreamers-build-night-session';

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typingEl = document.getElementById('typing');
const toastEl = document.getElementById('toast');
const progressEl = document.getElementById('progress');

let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem(SESSION_KEY, sessionId);
}

let conversation = JSON.parse(localStorage.getItem(SESSION_KEY + ':msgs') || '[]');
let sending = false;

function persist() {
  localStorage.setItem(SESSION_KEY + ':msgs', JSON.stringify(conversation));
}

function render() {
  if (conversation.length === 0) {
    // seed greeting
    conversation.push({
      role: 'assistant',
      text: "Hey! I'll help you ship a Tinyfish project to MentorMates tonight.\n\nWhat are you trying to build?",
      ts: Date.now(),
    });
    persist();
  }
  messagesEl.innerHTML = conversation.map(m => {
    const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const label = m.role === 'user' ? 'you' : 'agent';
    return `
      <div class="msg ${m.role}">
        <div class="msg-meta">${label} · ${time}</div>
        <div class="msg-bubble">${formatText(m.text)}</div>
      </div>
    `;
  }).join('');
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function updateProgress(stepId) {
  if (!stepId) return;
  const steps = Array.from(progressEl.querySelectorAll('.step'));
  const activeIdx = steps.findIndex(s => s.dataset.step === stepId);
  if (activeIdx < 0) return;
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i < activeIdx) s.classList.add('done');
    else if (i === activeIdx) s.classList.add('active');
  });
}

function formatText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  autoResize();
  conversation.push({ role: 'user', text, ts: Date.now() });
  persist();
  render();
  typingEl.classList.add('visible');
  try {
    const transcript = conversation
      .map(m => `${m.role === 'user' ? 'PARTICIPANT' : 'AGENT'}: ${m.text}`)
      .join('\n\n');
    const turnId = 'turn_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const res = await fetch(CONFIG.runEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workflow_id: CONFIG.workflow,
        input: {
          session_id: sessionId,
          run_id: turnId,
          idempotency_key: turnId,
          message: text,
          transcript: transcript,
        },
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data?.result?.output_text || data?.output_text || 'No response received.';
    const step = data?.result?.step || data?.step;
    conversation.push({ role: 'assistant', text: reply, ts: Date.now() });
    persist();
    if (step) updateProgress(step);
  } catch (err) {
    conversation.push({
      role: 'assistant',
      text: `Sorry — request failed: ${err.message}. Try again in a second.`,
      ts: Date.now(),
    });
    persist();
    showToast(`Request failed: ${err.message}`);
  } finally {
    typingEl.classList.remove('visible');
    sending = false;
    sendBtn.disabled = false;
    render();
    inputEl.focus();
  }
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  setTimeout(() => toastEl.classList.remove('visible'), 4000);
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear chat history and start a new session?')) return;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY + ':msgs');
  conversation = [];
  sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem(SESSION_KEY, sessionId);
  // reset progress bar
  const steps = Array.from(progressEl.querySelectorAll('.step'));
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i === 0) s.classList.add('active');
  });
  render();
});

render();
inputEl.focus();
</script>
</body>
</html>
